<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>TREND THEORY | Curated Fashion & Daily Edits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. LUXURY COLOR PALETTE (IVORY EDITORIAL & MIDNIGHT NOIR)
       ========================================================================== */
    :root[data-theme="light"] {
      --bg-main: #F9F6F0;
      --bg-secondary: #EFEAE0;
      --card-bg: #FFFFFF;
      --glass-bg: rgba(249, 246, 240, 0.88);
      --text-main: #181512;
      --text-muted: #6E655F;
      --accent-gold: #B8860B;
      --accent-terracotta: #8C4A32;
      --border-color: rgba(24, 21, 18, 0.1);
      --btn-bg: #181512;
      --btn-text: #F9F6F0;
      --shadow-soft: 0 8px 24px -6px rgba(24, 21, 18, 0.06);
      --shadow-hover: 0 18px 36px -10px rgba(24, 21, 18, 0.15);
    }

    :root[data-theme="dark"] {
      --bg-main: #0F0E0C;
      --bg-secondary: #1A1815;
      --card-bg: #161412;
      --glass-bg: rgba(15, 14, 12, 0.88);
      --text-main: #F5F2EB;
      --text-muted: #A39B90;
      --accent-gold: #D4AF37;
      --accent-terracotta: #E07A5F;
      --border-color: rgba(245, 242, 235, 0.12);
      --btn-bg: #D4AF37;
      --btn-text: #0F0E0C;
      --shadow-soft: 0 8px 24px -6px rgba(0, 0, 0, 0.45);
      --shadow-hover: 0 18px 36px -10px rgba(212, 175, 55, 0.16);
    }

    /* ==========================================================================
       2. STRICT UNIVERSAL SCREEN FIT & RESET
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.35s ease, color 0.35s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       3. INFINITE ANIMATED RUNWAY MARQUEE
       ========================================================================== */
    .marquee-wrap {
      width: 100%;
      background-color: #141210;
      color: #F5F2EB;
      padding: 0.5rem 0;
      overflow: hidden;
      white-space: nowrap;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    .marquee-track {
      display: inline-block;
      animation: scrollMarquee 26s linear infinite;
    }

    .marquee-track span {
      font-size: 0.68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin: 0 1.25rem;
      color: #E6DFD3;
    }

    .marquee-track .dot {
      color: #D4AF37;
      margin: 0 0.25rem;
    }

    @keyframes scrollMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ==========================================================================
       4. FLUID EDITORIAL HEADER
       ========================================================================== */
    header {
      text-align: center;
      padding: clamp(1.8rem, 5vw, 3.2rem) 1rem clamp(1.2rem, 3vw, 2rem);
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-block;
      font-size: clamp(0.62rem, 1.8vw, 0.72rem);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--accent-gold);
      font-weight: 700;
      margin-bottom: 0.6rem;
      padding: 0.3rem 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      background: var(--card-bg);
      animation: fadeDown 0.7s ease forwards;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.9rem, 6.5vw, 3.8rem);
      font-weight: 600;
      letter-spacing: clamp(2px, 0.8vw, 4px);
      line-height: 1.1;
      margin-bottom: 0.6rem;
      animation: fadeUp 0.8s ease forwards;
      word-break: break-word;
    }

    .brand-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      color: var(--text-muted);
      max-width: 520px;
      margin: 0 auto;
      padding: 0 0.5rem;
      line-height: 1.35;
      animation: fadeUp 1s ease forwards;
    }

    /* ==========================================================================
       5. STICKY CONTROLS (FIXED FOR ALL MOBILE & DESKTOP SCREENS)
       ========================================================================== */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
    }

    .controls-inner {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-box {
      width: 100%;
      height: 40px;
      padding: 0 1rem 0 2.35rem;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      background-color: var(--card-bg);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.14);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      pointer-events: none;
    }

    /* Swipeable Category Pills on Mobile, Centered on Desktop */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }

    .filter-group::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.42rem 0.9rem;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--btn-bg);
      color: var(--btn-text);
      border-color: var(--btn-bg);
    }

    @media (min-width: 820px) {
      .controls-inner {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .search-wrap {
        max-width: 340px;
      }
      .filter-group {
        width: auto;
        overflow-x: visible;
        flex-wrap: wrap;
      }
    }

    /* Status Counter Bar */
    .results-bar {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto 0.9rem;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       6. MULTI-DEVICE ADAPTIVE PRODUCT GRID
          - Mobile Phones: 2 Columns (App-Style)
          - Tablets: 3 Columns
          - Laptops/Desktops: 4 Columns
       ========================================================================== */
    .grid {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 0.75rem 4rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      flex-grow: 1;
    }

    @media (max-width: 340px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.25rem;
        padding: 0 1.25rem 4rem;
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1.65rem;
        padding: 0 1.5rem 5rem;
      }
    }

    /* ==========================================================================
       7. PROPORTIONAL CARDS WITH AUTO ASPECT-RATIO
       ========================================================================== */
    .card {
      width: 100%;
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-soft);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: cardCascade 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-gold);
    }

    /* Fluid 3:4 Fashion Portrait Ratio (Fits all screens automatically!) */
    .img-container {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      position: relative;
      background-color: var(--bg-secondary);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.65s ease;
    }

    .card:hover .card-img {
      transform: scale(1.07);
    }

    /* Responsive Badges */
    .pin-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      background: rgba(20, 18, 16, 0.86);
      color: #F9F6F0;
      font-size: clamp(0.62rem, 1.5vw, 0.74rem);
      font-weight: 700;
      padding: 0.25rem 0.55rem;
      border-radius: 20px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }

    .trend-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      background: linear-gradient(135deg, #B8860B, #8C4A32);
      color: #FFFFFF;
      font-size: clamp(0.55rem, 1.4vw, 0.66rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 0.25rem 0.55rem;
      border-radius: 20px;
      max-width: 62%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Card Text & CTA Area */
    .card-content {
      padding: clamp(0.7rem, 2vw, 1.2rem);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      background: var(--card-bg);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.25rem;
      margin-bottom: 0.3rem;
    }

    .category-tag {
      font-size: clamp(0.58rem, 1.4vw, 0.68rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .share-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .product-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.02rem, 2.5vw, 1.35rem);
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: clamp(0.65rem, 2vw, 1.1rem);
      line-height: 1.22;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .shop-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      width: 100%;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      padding: clamp(0.58rem, 1.8vw, 0.8rem) 0.5rem;
      border-radius: 8px;
      font-size: clamp(0.72rem, 1.8vw, 0.84rem);
      font-weight: 600;
      letter-spacing: 0.4px;
      overflow: hidden;
      transition: opacity 0.2s ease;
    }

    .shop-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      transition: all 0.55s ease;
    }

    .card:hover .shop-btn::before {
      left: 130%;
    }

    /* Floating Theme Button */
    .theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 90;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border-color);
      padding: 0.65rem 1rem;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-hover);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Empty State & Footer */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem 4.5rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.75rem;
      background: var(--bg-secondary);
      width: 100%;
    }

    .footer-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--text-main);
      letter-spacing: 2.5px;
      margin-bottom: 0.4rem;
    }

    @keyframes cardCascade {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Infinite Scrolling Runway Marquee -->
  <div class="marquee-wrap">
    <div class="marquee-track">
      <span>TREND THEORY OFFICIAL EDIT</span><span class="dot">✦</span>
      <span>CURATED DAILY PINTEREST FINDS</span><span class="dot">✦</span>
      <span>FESTIVE & ROYAL
